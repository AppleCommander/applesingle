plugins {
    id 'java'
}

subprojects {
    java {
        sourceCompatibility = 25
        targetCompatibility = 25
    }
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc).tap {
            configureEach {
                options.addStringOption('Xdoclint:none', '-quiet')
            }
        }
    }
}
